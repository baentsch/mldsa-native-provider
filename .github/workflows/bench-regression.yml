name: Nightly perf regression vs oqs-provider

# Guards against the native (asm) backend silently regressing to portable C.
# Both this provider and oqs-provider wrap the SAME mldsa-native core, so on the
# optimized platforms (x86_64 AVX2, AArch64 NEON) they should be within a small
# factor. ci/bench_vs_oqs.sh builds a minimal, host-optimized oqs-provider and
# runs ci/bench_regression.c, which fails if this provider is more than
# MLDSA_MAX_SLOWDOWN times slower on keygen or sign at any level.
#
# On failure the job goes red AND opens/updates a tracking issue (one per arch,
# de-duplicated); on recovery it closes that issue.

on:
  schedule:
    - cron: '17 3 * * *'   # nightly, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  # Fail if oqs-provider is more than this many times faster than us.
  MLDSA_MAX_SLOWDOWN: '1.5'

jobs:
  bench:
    name: bench ${{ matrix.arch }} vs oqs
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest,    arch: x86_64 }
          - { runner: ubuntu-24.04-arm, arch: aarch64 }
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build git

      # oqs-provider serves ML-DSA only below OpenSSL 3.5 (it cedes to the default
      # provider on 3.5+), so the head-to-head must run on a <3.5 build.
      - name: Cache OpenSSL build
        id: cache-ossl
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/ossl
          key: ossl-${{ matrix.arch }}-openssl-3.2-v1

      - name: Build OpenSSL (openssl-3.2)
        if: steps.cache-ossl.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 -b openssl-3.2 https://github.com/openssl/openssl.git ossl-src
          cd ossl-src
          ./Configure --prefix="${{ github.workspace }}/ossl" --libdir=lib no-docs
          make -j"$(nproc)"
          make install_sw

      - name: Build the provider (native backend)
        run: |
          O="${{ github.workspace }}/ossl"
          cmake -S . -B build \
            -DOPENSSL_ROOT_DIR="$O" -DOPENSSL_INCLUDE_DIR="$O/include" \
            -DOPENSSL_CRYPTO_LIBRARY="$O/lib/libcrypto.so" \
            -DOPENSSL_SSL_LIBRARY="$O/lib/libssl.so"
          cmake --build build -j"$(nproc)"
          LD_LIBRARY_PATH="$O/lib" OPENSSL_MODULES="$PWD/build" \
            "$O/bin/openssl" list -providers -verbose -provider mldsanative \
            | grep -i "build info" || true

      - name: Benchmark vs oqs-provider (regression gate)
        id: bench
        run: |
          O="${{ github.workspace }}/ossl"
          set +e
          OPENSSL_PREFIX="$O" OURS_SO="$PWD/build/mldsanative.so" \
            MLDSA_BENCH_MAX_SLOWDOWN="$MLDSA_MAX_SLOWDOWN" MLDSA_BENCH_SECONDS=1 \
            bash ci/bench_vs_oqs.sh 2>&1 | tee bench-output.txt
          rc=${PIPESTATUS[0]}
          set -e
          if   [ "$rc" -eq 0 ];  then echo "result=pass" >> "$GITHUB_OUTPUT"
          elif [ "$rc" -eq 77 ]; then echo "result=skip" >> "$GITHUB_OUTPUT"
          else                        echo "result=fail" >> "$GITHUB_OUTPUT"
          fi
          echo "exit code: $rc"

      - name: Open/update tracking issue on regression
        if: always() && steps.bench.outputs.result == 'fail'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const arch = '${{ matrix.arch }}';
            const marker = `<!-- perf-regression:${arch} -->`;
            const title = `⚠️ Nightly perf regression vs oqs-provider (${arch})`;
            let out = '';
            try { out = fs.readFileSync('bench-output.txt', 'utf8'); } catch (e) {}
            const tail = out.slice(-4000);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const owner = context.repo.owner, repo = context.repo.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo,
              { owner, repo, state: 'open', per_page: 100 });
            const existing = issues.find(i => (i.body || '').includes(marker));
            if (existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number,
                body: `Still slower than oqs-provider on **${arch}**. ${runUrl}\n\n\`\`\`\n${tail}\n\`\`\`` });
            } else {
              try { await github.rest.issues.createLabel({ owner, repo, name: 'perf-regression', color: 'd73a4a',
                description: 'Native backend slower than oqs-provider' }); } catch (e) {}
              const body = `${marker}\n\nThe nightly ML-DSA performance guard failed on **${arch}**: this provider is `
                + `more than ${process.env.MLDSA_MAX_SLOWDOWN}x slower than oqs-provider (same mldsa-native core), `
                + `which almost always means the native (asm) backend regressed to portable C — check that the build `
                + `still passes \`-mavx2\` (x86_64) and reports \`native ... asm\` in its build info.\n\nRun: ${runUrl}`
                + `\n\n\`\`\`\n${tail}\n\`\`\``;
              await github.rest.issues.create({ owner, repo, title, body, labels: ['perf-regression'] });
            }

      - name: Close tracking issue on recovery
        if: always() && steps.bench.outputs.result == 'pass'
        uses: actions/github-script@v7
        with:
          script: |
            const arch = '${{ matrix.arch }}';
            const marker = `<!-- perf-regression:${arch} -->`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const owner = context.repo.owner, repo = context.repo.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo,
              { owner, repo, state: 'open', per_page: 100 });
            const existing = issues.find(i => (i.body || '').includes(marker));
            if (existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number,
                body: `✅ Recovered on **${arch}**: back within ${process.env.MLDSA_MAX_SLOWDOWN}x of oqs-provider. Closing. ${runUrl}` });
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: 'closed' });
            }

      - name: Fail the job if a regression was detected
        if: steps.bench.outputs.result == 'fail'
        run: |
          echo "::error::ML-DSA performance regressed vs oqs-provider on ${{ matrix.arch }}"
          exit 1
