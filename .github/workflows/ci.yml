name: CI

on:
  # Only push events on main; branch commits are covered by pull_request, so a
  # branch with an open PR is not built twice (once for push, once for the PR).
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs for the same ref (e.g. rapid pushes to a PR); the newest
# commit is the only one worth building.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Demonstrate the version story AND the platform story:
#   * openssl-3.2 : the provider builds and its FIPS-204 KAT passes; the
#                   default-provider interop and IETF X.509 interop self-skip
#                   (the default provider / libcrypto have no ML-DSA before 3.5).
#   * openssl-3.5 : everything runs, including cross-provider interop, the IETF
#                   pqc-certificates interop, and an informational benchmark.
#   * x86_64 and aarch64 runners each exercise mldsa-native's CPU-optimized
#     native backend (AVX2 / AArch64 asm); the 3.5 benchmark reports the numbers.
jobs:
  build-test:
    name: ${{ matrix.arch }} / ${{ matrix.ossl-branch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest,    arch: x86_64,  ossl-branch: openssl-3.2 }
          - { runner: ubuntu-latest,    arch: x86_64,  ossl-branch: openssl-3.5 }
          - { runner: ubuntu-24.04-arm, arch: aarch64, ossl-branch: openssl-3.2 }
          - { runner: ubuntu-24.04-arm, arch: aarch64, ossl-branch: openssl-3.5 }
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake unzip

      - name: Cache OpenSSL build
        id: cache-ossl
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/ossl
          key: ossl-${{ matrix.arch }}-${{ matrix.ossl-branch }}-v1

      - name: Build OpenSSL (${{ matrix.ossl-branch }})
        if: steps.cache-ossl.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 -b ${{ matrix.ossl-branch }} \
            https://github.com/openssl/openssl.git ossl-src
          cd ossl-src
          ./Configure --prefix="${{ github.workspace }}/ossl" --libdir=lib no-docs
          make -j"$(nproc)"
          make install_sw

      - name: Report OpenSSL version
        run: |
          O="${{ github.workspace }}/ossl"
          LD_LIBRARY_PATH="$O/lib" "$O/bin/openssl" version

      - name: Configure & build the provider
        run: |
          O="${{ github.workspace }}/ossl"
          cmake -S . -B build \
            -DOPENSSL_ROOT_DIR="$O" \
            -DOPENSSL_INCLUDE_DIR="$O/include" \
            -DOPENSSL_CRYPTO_LIBRARY="$O/lib/libcrypto.so" \
            -DOPENSSL_SSL_LIBRARY="$O/lib/libssl.so"
          cmake --build build -j"$(nproc)"

      - name: Show advertised algorithms and active backend
        run: |
          O="${{ github.workspace }}/ossl"
          LD_LIBRARY_PATH="$O/lib" OPENSSL_MODULES="$PWD/build" \
            "$O/bin/openssl" list -providers -verbose -provider mldsanative

      - name: Run tests (KAT + interop + IETF pqc-certificates)
        run: |
          O="${{ github.workspace }}/ossl"
          LD_LIBRARY_PATH="$O/lib" ctest --test-dir build --output-on-failure --no-tests=error

      # The vs-default performance numbers are NOT collected here: benchmarking
      # on every push/PR is wasteful and noisy on shared runners. They are
      # gathered nightly instead -- see .github/workflows/bench-regression.yml
      # (job "perf-numbers"), off the critical push/PR path.
